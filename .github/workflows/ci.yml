# Backend tests on every supported Python, the frontend on Node 24 and on the oldest
# supported Node, the FlyGym physics tests (GLFW on a virtual X display, as check.sh does
# without a display or EGL), end-to-end tests of the built app on the toy engine and a
# dependency audit. Superseded runs are cancelled.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  backend:
    name: Backend tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # 3.12 is the recorded replay stack; 3.13 and 3.14 run the app without FlyVis.
        python: ['3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            backend/requirements-tools.lock
            backend/requirements.lock

      # pip itself comes from the hashed tools lock before anything else, as in setup.sh.
      # pip check also fails when pyproject's pins and the lock disagree.
      - name: Install the hashed tool and backend locks
        run: |
          python -m venv backend/.venv
          backend/.venv/bin/python -m pip install --disable-pip-version-check --require-hashes -r backend/requirements-tools.lock
          backend/.venv/bin/python -m pip install --disable-pip-version-check --require-hashes -r backend/requirements.lock
          backend/.venv/bin/python -m pip install --disable-pip-version-check --no-deps --no-build-isolation -e backend
          backend/.venv/bin/python -m pip check

      - name: Backend tests without FlyGym physics
        run: backend/.venv/bin/python -m pytest backend/tests -m 'not flygym' -q

      # frontend/src/api.gen.ts must match the API models; regenerate it without --check.
      - name: Generated TypeScript API types are up to date
        run: backend/.venv/bin/python scripts/gen_types.py --check

  frontend:
    name: Frontend checks (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # 24 is the default (LTS); 22.12.0 is the oldest release package.json allows.
        node: ['24', '22.12.0']
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend packages
        run: npm --prefix frontend ci --no-fund --no-audit

      - name: Frontend format, types, tests and build
        run: |
          npm --prefix frontend run format:check
          npm --prefix frontend run typecheck
          npm --prefix frontend test
          npm --prefix frontend run build

  physics:
    name: FlyGym physics tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements-tools.lock
            backend/requirements.lock

      # Xvfb plus Mesa's software OpenGL; GLFW (bundled with the glfw wheel) loads the X11 libraries.
      - name: Install Xvfb and Mesa OpenGL
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb xauth libgl1 libglx-mesa0 libgl1-mesa-dri \
            libx11-6 libxrandr2 libxinerama1 libxcursor1 libxi6 libxxf86vm1 libxkbcommon0

      - name: Install the hashed tool and backend locks
        run: |
          python -m venv backend/.venv
          backend/.venv/bin/python -m pip install --disable-pip-version-check --require-hashes -r backend/requirements-tools.lock
          backend/.venv/bin/python -m pip install --disable-pip-version-check --require-hashes -r backend/requirements.lock

      # Includes the bitwise check of the fast controller path against FlyGym's own controller.
      - name: FlyGym physics tests
        run: xvfb-run -a env MUJOCO_GL=glfw backend/.venv/bin/python -m pytest backend/tests -m flygym -q

  e2e:
    name: End-to-end tests (toy engine)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements-tools.lock
            backend/requirements.lock

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # The toy engine needs no OpenGL; scripts/start.sh runs the app from backend/.venv.
      - name: Install the hashed tool and backend locks
        run: |
          python -m venv backend/.venv
          backend/.venv/bin/python -m pip install --disable-pip-version-check --require-hashes -r backend/requirements-tools.lock
          backend/.venv/bin/python -m pip install --disable-pip-version-check --require-hashes -r backend/requirements.lock

      # Chromium matching the pinned @playwright/test, with its system libraries (CI only).
      - name: Install frontend packages and Playwright's Chromium
        run: |
          npm --prefix frontend ci --no-fund --no-audit
          cd frontend && npx playwright install --with-deps chromium

      # Playwright starts ./scripts/start.sh --toy --port 8199 and stops it afterwards.
      - name: Build the frontend and run the end-to-end tests
        run: |
          npm --prefix frontend run build
          npm --prefix frontend run e2e

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            frontend/e2e/playwright-report/
            frontend/e2e/test-results/
          retention-days: 14

  security:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: .github/requirements-audit.txt

      - name: Install pip-audit from its hashed lock
        run: |
          python -m venv "$RUNNER_TEMP/audit"
          "$RUNNER_TEMP/audit/bin/python" -m pip install --disable-pip-version-check --require-hashes -r .github/requirements-audit.txt

      # Audits the pins as written, without installing them. pip-audit cannot look up the
      # local "+cpu" PyTorch builds of the vision lock and lists them as skipped.
      - name: Audit the Python locks
        run: |
          # Pillow 12.3.0 advisories, all fixed only in Pillow 13, which FlyGym 2.1.0 (pillow<13)
          # does not allow yet. None is reachable: DigitalFly only encodes JPEG frames (and the
          # demo GIF) from arrays and decodes only its own JPEG frames. It never opens PDF, GIF,
          # PPM/PGM, TIFF or EPS input. Remove these when FlyGym allows Pillow 13.
          ignore=(
            GHSA-p4wg-p73j-c528  # CVE-2026-112895: PdfParser recursion when appending to a PDF
            GHSA-65qm-jvmh-6pqg  # CVE-2026-112400: GIF seek keeps a rejected size (GIF decoding)
            GHSA-58r4-6rv3-gfh8  # CVE-2026-112397: zero-width PPM/PGM image in ImageMorph
            GHSA-pchr-8j38-3x4p  # CVE-2026-112896: out-of-bounds read re-saving a loaded TIFF
            GHSA-q45j-58j2-45rg  # CVE-2026-112897: uninitialised pixels from short TIFF JPEG strips
            GHSA-462x-pgg6-55fp  # CVE-2026-112395: tiled-TIFF decode buffer size
            GHSA-c6hw-5grf-ff96  # CVE-2026-112404: out-of-bounds read in TIFF tile and RGBA decoding
            GHSA-vx6w-vv9f-6gvg  # CVE-2026-112899: EPS load(scale) past the decompression-bomb limit
          )
          "$RUNNER_TEMP/audit/bin/pip-audit" --disable-pip --require-hashes --progress-spinner off \
            "${ignore[@]/#/--ignore-vuln=}" \
            -r backend/requirements.lock -r backend/requirements-data.lock \
            -r backend/requirements-vision.lock -r backend/requirements-tools.lock \
            -r backend/requirements-nwb.lock -r backend/requirements-mcp.lock

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      # Reads package-lock.json only; nothing is installed.
      - name: Audit the frontend lockfile
        run: npm --prefix frontend audit --audit-level=high
