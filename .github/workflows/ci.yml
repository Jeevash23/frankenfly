# Light checks for a private repository: one Ubuntu job, cached dependencies,
# superseded runs cancelled. FlyGym physics tests need an OpenGL context and are
# skipped here; run ./scripts/check.sh locally for the full suite.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.lock

      - name: Install the hashed backend lock
        run: |
          python -m venv backend/.venv
          backend/.venv/bin/python -m pip install --disable-pip-version-check --require-hashes -r backend/requirements.lock

      - name: Backend tests without FlyGym physics
        run: backend/.venv/bin/python -m pytest backend/tests -m 'not flygym' -q

      # The oldest supported Node release, so CI also checks the lower bound.
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend packages
        run: npm --prefix frontend ci --no-fund --no-audit

      - name: Frontend format, types, tests and build
        run: |
          npm --prefix frontend run format:check
          npm --prefix frontend run typecheck
          npm --prefix frontend test
          npm --prefix frontend run build
