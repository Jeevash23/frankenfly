[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "digitalfly"
version = "0.6.0"
description = "A local, inspectable sensorimotor workbench"
requires-python = ">=3.12,<3.15"
dependencies = [
  "flygym==2.1.0",
  "fastapi==0.141.1",
  "uvicorn==0.53.0",
  "pydantic==2.13.5",
  "numpy>=2.0,<3",
  "scipy>=1.11,<2",
  # Imported directly; the ranges are FlyGym 2.1.0's own caps.
  "mujoco>=3.9,<3.10",
  "pillow>=11,<13",
  "websockets==17.1",
  "psutil==7.2.2",
]

[project.optional-dependencies]
test = ["pytest==9.1.1", "httpx==0.28.1"]
# Build scripts only (scripts/build_circuit.py); the app never imports these.
data = ["pyarrow==25.0.1"]
# Optional NWB export of saved runs (digitalfly.nwb, scripts/toolkit.py nwb); the app runs without it.
nwb = ["pynwb==4.2.0"]
# Optional MCP server (digitalfly.mcp, scripts/mcp.py) for agents such as Claude Code; the app runs without it.
mcp = ["mcp==2.3.0"]
# Optional FlyVis vision front end. CPU-only PyTorch: the CUDA build is about 3 GB.
# FlyVis 1.2.0 and its datamate dependency support Python 3.12 only.
vision = [
  "flyvis==1.2.0; python_version < '3.13'",
  "torch==2.14.1+cpu; sys_platform == 'linux' and python_version < '3.13'",
  "torch==2.14.1; sys_platform == 'darwin' and python_version < '3.13'",
  "torchvision==0.29.1+cpu; sys_platform == 'linux' and python_version < '3.13'",
  "torchvision==0.29.1; sys_platform == 'darwin' and python_version < '3.13'",
]

[project.scripts]
# The MCP server over a running app's API (needs the mcp extra: ./scripts/setup.sh --with mcp).
digitalfly-mcp = "digitalfly.mcp:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
markers = ["flygym: real FlyGym integration", "render: requires an offscreen graphics context"]
testpaths = ["tests"]

