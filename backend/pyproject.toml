[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "digitalfly"
version = "0.3.0"
description = "A local, inspectable sensorimotor workbench"
requires-python = ">=3.12,<3.13"
dependencies = [
  "flygym==2.1.0",
  "fastapi==0.141.1",
  "uvicorn==0.53.0",
  "pydantic==2.13.5",
  "numpy>=2.0,<3",
  "scipy>=1.11,<2",
  "websockets==17.1",
  "psutil==7.2.2",
]

[project.optional-dependencies]
test = ["pytest==9.1.1", "httpx==0.28.1"]
# Build scripts only (scripts/build_circuit.py); the app never imports these.
data = ["pyarrow==25.0.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
markers = ["flygym: real FlyGym integration", "render: requires an offscreen graphics context"]
testpaths = ["tests"]

